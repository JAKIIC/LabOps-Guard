<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src 'none'; font-src 'none'; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>LabOps Guard · Evidence Replay</title>
  <style>
    :root{--bg:#06111d;--panel:#0b1b2b;--panel2:#0f2437;--line:#203c54;--text:#e8f1f7;--muted:#8fa8ba;--cyan:#54dfc2;--green:#22c58b;--amber:#ffc45f;--red:#ff7a8c;--blue:#74b7f3;--radius:18px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% -10%,#113451 0,transparent 32%),radial-gradient(circle at 92% 8%,#0b453f55 0,transparent 25%),var(--bg);color:var(--text);font:15px/1.55 Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to bottom,#0009,transparent 78%)}
    .wrap{width:min(1220px,calc(100% - 32px));margin:auto;padding:28px 0 54px;position:relative}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:13px}.mark{width:48px;height:48px;border:1px solid #3e718d;border-radius:15px;display:grid;place-items:center;color:var(--cyan);background:linear-gradient(145deg,#173b54,#091827);font-size:21px;font-weight:800;box-shadow:0 0 28px #54dfc218}.brand-name{font-size:21px;font-weight:750}.brand-sub{font:11px ui-monospace,Consolas,monospace;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.labels{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);background:#091826;font-size:11px}.pill.verified{color:var(--cyan);border-color:#28765f;background:#0b2c28}.pill.readonly{color:var(--amber);border-color:#6d562d;background:#2b2211}
    .panel{border:1px solid var(--line);background:linear-gradient(145deg,rgba(14,35,53,.97),rgba(7,20,33,.97));border-radius:var(--radius);box-shadow:0 18px 60px #0005}.hero{padding:30px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:260px;height:260px;border:46px solid #54dfc208;border-radius:50%;right:-80px;top:-110px}.kicker{font:700 11px ui-monospace,Consolas,monospace;letter-spacing:.15em;color:var(--cyan);text-transform:uppercase}.hero h1{font-size:clamp(29px,4vw,48px);line-height:1.08;margin:10px 0 15px;max-width:850px}.hero p{color:#abc0cf;max-width:860px;margin:0}.truth-line{display:flex;gap:9px;flex-wrap:wrap;margin-top:19px}.truth-line span{border:1px solid #28516a;background:#0a2434;border-radius:8px;padding:6px 10px;color:#aee5da;font-size:12px}
    .section{margin-top:18px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:10px;padding:0 3px}.head h2{font-size:18px;margin:0}.head p{font:11px ui-monospace,Consolas,monospace;color:var(--muted);margin:0}.pad{padding:22px}.summary{display:grid;grid-template-columns:1.35fr repeat(3,1fr);gap:12px}.summary-card{padding:18px;min-width:0}.label{color:var(--muted);font-size:11px}.value{font-size:20px;font-weight:750;margin-top:5px;overflow-wrap:anywhere}.value.ok{color:var(--cyan)}.value.warn{color:var(--amber)}.tiny{font-size:11px;color:#6f8da3;margin-top:4px}
    .metric-stage{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:12px}.score{padding:24px;display:grid;gap:10px}.score.before{border-color:#653749;background:linear-gradient(145deg,#2b1722,#0b1b2b)}.score.after{border-color:#246a57;background:linear-gradient(145deg,#0d322d,#0b1b2b)}.score .number{font-size:clamp(38px,6vw,70px);font-weight:800;line-height:1}.score.before .number{color:var(--red)}.score.after .number{color:var(--cyan)}.repeat{font:12px ui-monospace,Consolas,monospace;color:#b4c6d3;overflow-wrap:anywhere}.arrow{align-self:center;font-size:34px;color:#55758d;padding:8px}
    .agents{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:20px 14px}.agent{text-align:center;position:relative;min-width:0}.agent:not(:last-child):after{content:"";position:absolute;height:1px;background:#315d73;top:19px;left:67%;width:66%}.agent-num{width:39px;height:39px;margin:0 auto 9px;border-radius:50%;display:grid;place-items:center;border:1px solid #37735f;background:#103832;color:var(--cyan);font:12px ui-monospace,Consolas,monospace;position:relative;z-index:1}.agent b{font-size:12px;display:block}.agent span{font-size:10px;color:var(--muted)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.card{border:1px solid var(--line);background:#0a1c2d;border-radius:14px;padding:15px;min-width:0}.card h3{font-size:14px;margin:5px 0 8px}.card p{margin:0;color:#9fb5c5;font-size:12px}.card .state{font:10px ui-monospace,Consolas,monospace;letter-spacing:.08em;color:var(--muted)}.card.excluded .state{color:var(--blue)}.card.confirmed{border-color:#28705c;background:#0c2c28}.card.confirmed .state{color:var(--cyan)}.hash{font:11px ui-monospace,Consolas,monospace;color:#8da8ba;overflow-wrap:anywhere}.list{display:grid;gap:8px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:16px;border-top:1px solid #1c364a;padding-top:8px;color:#9eb3c2;font-size:12px}.row b{color:var(--text);text-align:right}.checklist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}.check{border:1px solid #245044;background:#0b2926;border-radius:10px;padding:9px 11px;color:#a9dacf;font-size:11px}.check:before{content:"✓";color:var(--cyan);margin-right:7px}
    .change{border:1px solid #315873;border-radius:12px;background:#091a29;padding:14px;margin-top:12px}.change-code{font:12px ui-monospace,Consolas,monospace;color:#c5d8e5;overflow-wrap:anywhere}.from{color:var(--red)}.to{color:var(--cyan)}.approval{border-color:#735d2d;background:linear-gradient(145deg,#2a2313,#0b1b2b)}.approval .seal{font-size:32px;color:var(--amber);font-weight:800}.runner{border-color:#28705c}.runner .seal{font-size:32px;color:var(--cyan);font-weight:800}
    .trace{padding:12px 21px}.trace-item{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid #1d364b}.trace-item:last-child{border:0}.seq{font:11px ui-monospace,Consolas,monospace;color:var(--cyan)}.trace-item b{font-size:12px}.trace-item p{margin:2px 0 0;color:var(--muted);font-size:11px}.trace-status{font:10px ui-monospace,Consolas,monospace;color:#9ee6d7;border:1px solid #2b6857;border-radius:999px;padding:3px 7px;white-space:nowrap}
    .decision{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:25px}.decision h3{font-size:26px;margin:4px 0;color:var(--cyan)}.decision p{color:#a6bac9;margin:0}.decision-mark{width:95px;height:95px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--cyan);color:var(--cyan);font-weight:850;box-shadow:0 0 40px #54dfc226}.bundle{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px}.bundle .digest{font:12px ui-monospace,Consolas,monospace;color:#c7d9e4;overflow-wrap:anywhere}.branches .card{min-height:160px}.blocked{border-color:#765b2d;background:#292110}.blocked .state{color:var(--amber)}.rolled{border-color:#71384a;background:#2d1720}.rolled .state{color:var(--red)}
    .notice{margin-top:18px;border:1px solid #715a2c;background:#2b2212;border-radius:14px;padding:14px 16px;color:#e9cf9b;font-size:12px}.notice b{color:var(--amber)}footer{display:flex;justify-content:space-between;gap:16px;color:#658298;font-size:10px;margin-top:22px;padding:0 4px}
    @media(max-width:980px){.summary{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.agents{grid-template-columns:repeat(3,1fr);gap:20px}.agent:after{display:none}.grid3{grid-template-columns:1fr}.metric-stage{grid-template-columns:1fr}.arrow{transform:rotate(90deg);justify-self:center;padding:0}.decision{grid-template-columns:1fr}.decision-mark{display:none}}
    @media(max-width:650px){.wrap{width:min(100% - 20px,1220px);padding-top:18px}.topbar{align-items:flex-start;flex-direction:column}.labels{justify-content:flex-start}.hero{padding:22px}.summary,.grid2,.cards{grid-template-columns:1fr}.agents{grid-template-columns:1fr 1fr}.checklist{grid-template-columns:1fr}.trace-item{grid-template-columns:34px 1fr}.trace-status{grid-column:2}.bundle{align-items:flex-start;flex-direction:column}footer{flex-direction:column}}
    @media print{body{background:#fff;color:#111}.panel,.card{box-shadow:none;background:#fff;border-color:#bbb}.muted,.tiny,.label,.card p,.trace-item p{color:#444!important}.wrap{width:100%;padding:0}.notice{background:#fff7df}.value.ok,.score.after .number,.decision h3{color:#087f66!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div class="brand"><div class="mark">LG</div><div><div class="brand-name">LabOps Guard</div><div class="brand-sub">Public Evidence Replay</div></div></div>
      <div class="labels"><span class="pill verified">Archived Verified Run</span><span class="pill">Evidence Replay</span><span class="pill readonly">Read-only · Static</span></div>
    </header>
    {{PUBLIC_DEMO_CONTENT}}
    <div class="notice"><b>事实边界：</b>这是经过校验的归档证据回放，不是实时 Agent 运行界面。页面不能执行实验、修改状态、读取任意文件或访问控制面。</div>
    <footer><span>LabOps Guard · GOAI Agent Infra preliminary demo</span><span>Static artifact · no live control plane</span></footer>
  </main>
</body>
</html>
