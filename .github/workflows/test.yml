name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and contract tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Evidence integrity
        run: python -B scripts/verify_evidence.py
      - name: Sensitive-pattern scan
        run: python -B scripts/scan_sensitive.py --repo-root .
