name: Deploy public evidence replay

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-evidence-replay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify archived replay
        run: python -B scripts/build_public_demo.py --check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public replay
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/public-demo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
